# Render.com config (free tier) - "New -> Blueprint" and point it at this
# repo, or create a Web Service from the Dockerfile directly.
#
# Note: Render's free tier sleeps after ~15 min idle and cold-starts on
# the next request (about a minute for this image). Fine for a
# hit-when-you-want-it API or paired with an uptime ping.
services:
  - type: web
    name: reel-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: API_KEY            # your own secret; curl -H "X-API-Key: ..."
        sync: false
      - key: GOOGLE_API_KEY     # Gemini key (aistudio.google.com)
        sync: false
      - key: IG_ACCESS_TOKEN    # Instagram token (see IG_SETUP.md step 6)
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: GH_REPO
        value: Souravvmishra/storage   # PUBLIC repo for the raw URL
      - key: GH_TOKEN           # Contents read/write on that repo
        sync: false
