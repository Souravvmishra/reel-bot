# Post the reel on a schedule - the zero-hosting option.
#
# Runs the exact same pipeline as the local/API flow on a free GitHub
# Actions runner (ffmpeg is bundled via imageio-ffmpeg):
#   generate -> render -> encode -> push to GH_REPO -> post to IG ->
#   upload the same file to YouTube -> cleanup.
#
# Two ways to trigger:
#   1. On a schedule: THREE times a day at the posting windows (see
#      below; cron is UTC).
#   2. On demand: repo -> Actions -> "post-reel" -> Run workflow, or:
#      curl -X POST -H "Authorization: Bearer <PAT>" \
#        "https://api.github.com/repos/<owner>/<repo>/actions/workflows/post_reel.yml/dispatches" \
#        -d '{"ref":"main"}'
#
# Posting times (3/day, tuned to 2026 engagement data):
#   - 03:30 UTC  -> 09:00 IST (India morning peak, 8-11am)
#   - 12:00 UTC  -> 17:30 IST, 07:00 EST, 13:00 CET  (morning-US window)
#   - 16:30 UTC  -> 22:00 IST, 11:30 EST, 17:30 CET  (evening peak)
#   Once Instagram Insights shows your followers' active hours, tune the
#   three cron lines below and post ~1h BEFORE the peak.
#
# One-time setup: add these repo secrets (Settings -> Secrets and
# variables -> Actions): GOOGLE_API_KEY, GOOGLE_API_KEY_BACKUP (optional -
# used if the primary is out of quota), IG_ACCESS_TOKEN, IG_USER_ID,
# GH_REPO, GH_TOKEN, YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN.
# GH_TOKEN needs Contents read/write on GH_REPO; the YT_* secrets come
# from the one-time Google login (see docs/YT_SETUP.md - run
# post_youtube.py --auth locally to get YT_REFRESH_TOKEN).
name: post-reel

# The save-history step pushes post_history.json back to THIS repo, so the
# built-in GITHUB_TOKEN needs write access (public repos default to read).
permissions:
  contents: write

on:
  workflow_dispatch:        # manual / API trigger
  schedule:
    - cron: "30 3 * * *"     # daily 03:30 UTC (India morning peak)
    - cron: "0 12 * * *"     # daily 12:00 UTC
    - cron: "30 16 * * *"    # daily 16:30 UTC

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Generate + post the reel
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY_BACKUP: ${{ secrets.GOOGLE_API_KEY_BACKUP }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_REPO: ${{ secrets.GH_REPO }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          AUDIO_PATH: audio/reel.mp3   # muxed into the reel on the runner
        # --post without --video-url auto-hosts the freshly made reel on
        # GitHub for IG (generate -> render -> encode -> host -> publish ->
        # cleanup); --youtube uploads that same local file straight to
        # YouTube (the Data API accepts a direct file upload, so no
        # hosting needed there).
        run: |
          python3 src/content_agent.py --post --youtube

      # Push the updated post_history.json back so the subject-rotation
      # memory (last 5 posts) survives from one scheduled run to the next.
      # Uses the built-in GITHUB_TOKEN (write access via the workflow's
      # permissions block) - no extra secret needed for this repo.
      - name: Save post history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add post_history.json
          if git diff --cached --quiet; then
            echo "no history change"
          else
            git commit -m "post history: update rotation memory"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
          fi
